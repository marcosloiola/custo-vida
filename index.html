<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --good-bg: #e8f7e8;
    --warning-bg: #fef3dc;
    --critical-bg: #fbe6e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text-primary); }
  header.top { padding: 28px 32px 0 32px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
  nav.tabs { display: flex; gap: 4px; max-width: 1200px; margin: 0 auto; padding: 0 32px; border-bottom: 1px solid var(--grid); flex-wrap: wrap; }
  nav.tabs button { appearance: none; border: none; background: transparent; padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; }
  nav.tabs button:hover { background: rgba(11,11,11,0.04); }
  nav.tabs button.active { color: var(--series-1); border-bottom-color: var(--series-1); }
  nav.tabs button.year-tab { color: var(--text-primary); }
  nav.tabs button.active.year-tab { color: var(--series-1); }
  nav.tabs button .badge { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: var(--good-bg); color: var(--good); vertical-align: middle; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 60px 32px; }
  .month-panel { display: none; }
  .month-panel.active { display: block; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi-tile.featured { border-width: 2px; }
  .kpi-row.consolidado.good .kpi-tile.featured { border-color: var(--good); background: var(--good-bg); }
  .kpi-row.consolidado.critical .kpi-tile.featured { border-color: var(--critical); background: var(--critical-bg); }
  .kpi-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-sub.good { color: var(--good); }
  .kpi-sub.warning { color: #a86a00; }
  .kpi-sub.critical { color: var(--critical); }
  .kpi-value.good { color: var(--good); }
  .kpi-value.critical { color: var(--critical); }
  .panel-title { font-size: 15px; font-weight: 700; margin: 28px 0 10px 0; }
  .panel-note { font-size: 12px; color: var(--muted); margin: -4px 0 12px 0; }
  .chart-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; }
  .chart-card canvas { max-width: 100%; }
  .month-status-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
  .month-status-card { border-radius: 10px; padding: 14px 14px; border: 1px solid var(--border); background: var(--surface-1); border-top: 4px solid var(--muted); }
  .month-status-card.good { background: var(--good-bg); border-top-color: var(--good); }
  .month-status-card.warning { background: var(--warning-bg); border-top-color: var(--warning); }
  .month-status-card.critical { background: var(--critical-bg); border-top-color: var(--critical); }
  .month-status-card .m-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .month-status-card .m-state { font-size: 11px; font-weight: 600; margin-bottom: 10px; }
  .month-status-card.good .m-state { color: #075c07; }
  .month-status-card.warning .m-state { color: #7a4b00; }
  .month-status-card.critical .m-state { color: #8a1616; }
  .month-status-card .m-saldo { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .month-status-card .m-saldo.good { color: var(--good); }
  .month-status-card .m-saldo.critical { color: var(--critical); }
  .month-status-card .m-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; padding: 3px 0; border-top: 1px dashed rgba(11,11,11,0.12); }
  .month-status-card .m-row:first-of-type { border-top: none; padding-top: 0; }
  .month-status-card .m-row-label { color: var(--muted); }
  .month-status-card .m-row-value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .month-status-card .m-row-value.good { color: var(--good); }
  .month-status-card .m-row-value.critical { color: var(--critical); }
  .month-status-card .m-pct { font-size: 11px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .month-status-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .month-status-grid { grid-template-columns: repeat(2, 1fr); } }
  table.cat-table { width: 100%; border-collapse: collapse; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; }
  table.cat-table th, table.cat-table td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.cat-table th:first-child, table.cat-table td:first-child { text-align: left; white-space: normal; }
  table.cat-table th { background: rgba(11,11,11,0.03); color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  table.cat-table tr:last-child td { border-bottom: none; }
  table.cat-table td.good { color: var(--good); font-weight: 600; }
  table.cat-table td.critical { color: var(--critical); font-weight: 600; }
  .meter-cell { min-width: 172px; }
  .meter-inline { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .meter-track { position: relative; width: 120px; flex: 0 0 120px; height: 8px; background: var(--grid); border-radius: 4px; display: inline-block; vertical-align: middle; }
  .meter-fill { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; }
  .meter-mark { position: absolute; top: -2px; width: 2px; height: 12px; background: var(--text-primary); opacity: 0.5; }

const fmtBRL = (v) => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const fmtBRL2 = (v) => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:2});
const fmtPct = (v) => v.toLocaleString('pt-BR', {maximumFractionDigits:0}) + '%';
const brDate = (iso) => iso ? iso.split('-').reverse().join('/') : '';

function statusFor(projecao, budget) {
  if (projecao < 0) {
    // categoria ficou negativa (ex.: um ajuste/saldo devedor maior que o gasto do período) —
    // trata-se como "devendo" ao orçamento, nunca como saldo positivo.
    return {level:'critical', label:'Acima do orçamento', icon:'▲'};
  }
  if (budget <= 0) {
    return projecao > 0 ? {level:'critical', label:'Fora do orçamento', icon:'●'} : {level:'good', label:'Sem gasto previsto', icon:'●'};
  }
  const ratio = projecao / budget;
  if (ratio <= 1.03) return {level:'good', label:'Dentro do orçamento', icon:'●'};
  if (ratio <= 1.15) return {level:'warning', label:'Atenção', icon:'▲'};
  return {level:'critical', label:'Acima do orçamento', icon:'▲'};
}

let charts = {};
const TOTAL_TABS = REPORT.months.length + 1; // + Visão do Ano

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  const monthShort = { 'Abril 2026':'Abril', 'Maio 2026':'Maio', 'Junho 2026':'Junho', 'Julho 2026':'Julho', 'Agosto 2026':'Agosto', 'Setembro 2026':'Setembro' };
  REPORT.months.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.textContent = monthShort[m.nome] || m.nome;
    if (m.is_current) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'em andamento';
      btn.appendChild(badge);
    }
    btn.addEventListener('click', () => selectTab(i));
    tabsEl.appendChild(btn);
  });
  const yearBtn = document.createElement('button');
  yearBtn.textContent = 'Visão do Ano';
  yearBtn.className = 'year-tab';
  yearBtn.addEventListener('click', () => selectTab(REPORT.months.length));
  tabsEl.appendChild(yearBtn);
}

function selectTab(idx) {
  document.querySelectorAll('nav.tabs button').forEach((b,i) => b.classList.toggle('active', i===idx));
  document.querySelectorAll('.month-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
  if (idx < REPORT.months.length) {
    renderMonthCharts(REPORT.months[idx]);
  }
}

function outsideListHTML(list, totalKey) {
  if (!list || list.length === 0) {
    return `<div class="outside-empty">Nenhum gasto fora do orçamento mensal neste período.</div>`;
  }
  return `<div class="outside-list">` + list.map(c => `
    <div class="outside-chip"><span class="name">${c.categoria}</span><span class="val">${fmtBRL2(c[totalKey])}</span></div>
  `).join('') + `</div>`;
}

            <th style="text-align:left;">Descrição</th>
            <th>Valor</th>
            <th>Parcelado</th>
            <th>Recorrente</th>
          </tr>
        </thead>
        <tbody id="txn-tbody-${key}"></tbody>
      </table>
    </div>
    <div class="txn-count" id="txn-count-${key}"></div>
  `;

  return `
    ${kpiRow}
    <div class="panel-title">Orçamento vs. gasto lançado, por categoria</div>
    <div class="chart-card"><canvas id="chart-budget-${key}" height="90"></canvas></div>

    <div class="panel-title">Gasto acumulado vs. orçamento acumulado no mês</div>
    <div class="panel-note">Orçamento acumulado = média diária do orçamento (budget do mês ÷ dias do mês) multiplicada pelos dias transcorridos. Gasto acumulado = soma real das transações lançadas até cada dia. Receita disponível = linha constante (receita entra de uma vez só no início do mês), já descontada a reserva de investimento de ${fmtBRL2(m.reserva_investimento_mes)}.</div>
    <div class="chart-card"><canvas id="chart-cum-${key}" height="90"></canvas></div>

    ${table}
    ${outside}
    ${txnSection}
  `;
}

function renderMonthCharts(m) {
  const key = m.nome.replace(/\s/g,'');
  const cats = m.categorias.map(c => c.categoria);

  const ctx1 = document.getElementById('chart-budget-'+key);
  if (charts['budget-'+key]) charts['budget-'+key].destroy();
  charts['budget-'+key] = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: cats,
      datasets: [
        { label: 'Budget', data: m.categorias.map(c => c.budget), backgroundColor: '#2a78d6', borderRadius: 3, maxBarThickness: 26 },
        { label: m.is_current ? 'Gasto lançado' : 'Gasto final', data: m.categorias.map(c => c.gasto_total_logado), backgroundColor: '#eb6834', borderRadius: 3, maxBarThickness: 26 },
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmtBRL2(c.raw)}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { autoSkip: false, maxRotation: 55, minRotation: 55, font: { size: 11 } } },
        y: { ticks: { callback: (v) => fmtBRL(v) }, grid: { color: '#e1e0d9' } }
      }
    }
  });

  const ctx2 = document.getElementById('chart-cum-'+key);
  if (charts['cum-'+key]) charts['cum-'+key].destroy();
  charts['cum-'+key] = new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: m.cumulativo.dias.map(d => 'Dia '+d),
      datasets: [
        { type: 'bar', label: 'Budget acumulado', data: m.cumulativo.budget_acumulado, backgroundColor: '#2a78d6', borderRadius: 2, maxBarThickness: 16, order: 2 },
        { type: 'bar', label: 'Gasto acumulado', data: m.cumulativo.gasto_acumulado, backgroundColor: '#eb6834', borderRadius: 2, maxBarThickness: 16, order: 2 },
        { type: 'line', label: 'Receita disponível', data: m.cumulativo.receita_acumulada, borderColor: '#1baf7a', backgroundColor: '#1baf7a', borderWidth: 2, borderDash: [6,4], pointRadius: 0, tension: 0, order: 1 },
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmtBRL2(c.raw)}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { autoSkip: true, maxRotation: 0, font: { size: 10 } } },
        y: { ticks: { callback: (v) => fmtBRL(v) }, grid: { color: '#e1e0d9' } }
      }
    }
  });
}

function yearPanelHTML(ano) {
  const saldoMensal = ano.budget_acumulado_ate_mes_atual - ano.gasto_acumulado_meses_com_dados;
  const saldoMensalLevel = saldoMensal >= 0 ? 'good' : 'critical';

  const budgetAnualCV = ano.budget_carro + ano.budget_viagem;
  const gastoAnualCV = ano.gasto_carro_acumulado + ano.gasto_viagem_acumulado;
  const saldoAnualCV = budgetAnualCV - gastoAnualCV;
  const saldoAnualLevel = saldoAnualCV >= 0 ? 'good' : 'critical';

  const kpiRow = `
    <div class="panel-title" style="margin-top:0;">Orçamento mensal (categorias com orçamento mensal)</div>
    <div class="panel-note">Soma do budget e do gasto mês a mês, Abril–${ano.mes_atual_label} (meses com dados: ${ano.meses_com_dados.join(', ')}).</div>
    <div class="kpi-row" style="grid-template-columns: repeat(3, 1fr);">
      <div class="kpi-tile">
        <div class="kpi-label">Budget mensal disponível no ano</div>
        <div class="kpi-value">${fmtBRL(ano.budget_acumulado_ate_mes_atual)}</div>
        <div class="kpi-sub">meses já passados + ${ano.mes_atual_label}</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Consumido do budget mensal</div>
        <div class="kpi-value">${fmtBRL(ano.gasto_acumulado_meses_com_dados)}</div>
        <div class="kpi-sub">gasto real, Abril–${ano.mes_atual_label}</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Saldo disponível do budget mensal</div>
        <div class="kpi-value ${saldoMensalLevel}">${fmtBRL(Math.abs(saldoMensal))}</div>
        <div class="kpi-sub ${saldoMensalLevel}">${saldoMensal >= 0 ? 'sobra' : 'déficit'} · budget acumulado − consumido</div>
      </div>
    </div>

    <div class="panel-title">Orçamento anual (Carro + Viagem)</div>
    <div class="panel-note">Categorias com orçamento anual, não mensal. Elevah tem budget R$ 0 e não entra nesta soma — acompanhe ela na tabela "Categorias com orçamento anual" abaixo.</div>
    <div class="kpi-row" style="grid-template-columns: repeat(3, 1fr);">
      <div class="kpi-tile">
        <div class="kpi-label">Budget anual (Carro + Viagem)</div>
        <div class="kpi-value">${fmtBRL(budgetAnualCV)}</div>
        <div class="kpi-sub">Carro (${fmtBRL2(ano.budget_carro)}) + Viagem (${fmtBRL2(ano.budget_viagem)})</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Consumido do budget anual</div>
        <div class="kpi-value">${fmtBRL(gastoAnualCV)}</div>
        <div class="kpi-sub">Carro (${fmtBRL2(ano.gasto_carro_acumulado)}) + Viagem (${fmtBRL2(ano.gasto_viagem_acumulado)})</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Saldo do budget anual</div>
        <div class="kpi-value ${saldoAnualLevel}">${fmtBRL(Math.abs(saldoAnualCV))}</div>
        <div class="kpi-sub ${saldoAnualLevel}">${saldoAnualCV >= 0 ? 'sobra' : 'déficit'} · budget anual − consumido</div>
      </div>
    </div>
  `;

  const budgetTotalConsolidado = ano.budget_acumulado_ate_mes_atual + budgetAnualCV;
  const consumidoTotalConsolidado = ano.gasto_acumulado_meses_com_dados + gastoAnualCV;
  const saldoTotalConsolidado = budgetTotalConsolidado - consumidoTotalConsolidado;
  const saldoTotalLevel = saldoTotalConsolidado >= 0 ? 'good' : 'critical';

  const resumoConsolidado = `
    <div class="panel-title">Resumo consolidado do ano</div>
    <div class="panel-note">Fotografia do ano até agora: budget mensal + budget anual (Carro + Viagem), menos o que já foi consumido de cada um.</div>
    <div class="kpi-row consolidado ${saldoTotalLevel}" style="grid-template-columns: repeat(3, 1fr);">
      <div class="kpi-tile">
        <div class="kpi-label">Budget total (mensal + anual)</div>
        <div class="kpi-value">${fmtBRL(budgetTotalConsolidado)}</div>
        <div class="kpi-sub">mensal (${fmtBRL2(ano.budget_acumulado_ate_mes_atual)}) + anual (${fmtBRL2(budgetAnualCV)})</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Consumido total (mensal + anual)</div>
        <div class="kpi-value">${fmtBRL(consumidoTotalConsolidado)}</div>
        <div class="kpi-sub">mensal (${fmtBRL2(ano.gasto_acumulado_meses_com_dados)}) + anual (${fmtBRL2(gastoAnualCV)})</div>
      </div>
      <div class="kpi-tile featured">
        <div class="kpi-label">Saldo consolidado do ano</div>
        <div class="kpi-value ${saldoTotalLevel}">${fmtBRL(Math.abs(saldoTotalConsolidado))}</div>
        <div class="kpi-sub ${saldoTotalLevel}">${saldoTotalConsolidado >= 0 ? 'sobra' : 'déficit'} · budget total − consumido total</div>
      </div>
    </div>
  `;

  const catRows = ano.categorias.map(c => {
    const st = statusFor(c.gasto_acumulado, c.budget_acumulado_ate_ago);
    const pctBar = c.gasto_acumulado < 0 ? 100 : (c.budget_acumulado_ate_ago > 0 ? Math.min(100, c.pct_consumido) : (c.gasto_acumulado > 0 ? 100 : 0));
    const fillColor = st.level === 'good' ? 'var(--good)' : (st.level === 'warning' ? 'var(--warning)' : 'var(--critical)');
    return `
      <tr>
        <td>${c.categoria}</td>
        <td>${fmtBRL2(c.budget_anual)}</td>
        <td>${fmtBRL2(c.budget_acumulado_ate_ago)}</td>
        <td>${fmtBRL2(c.gasto_acumulado)}</td>
        <td class="meter-cell">
          <span class="meter-inline">
            <span class="meter-track"><span class="meter-fill" style="width:${pctBar}%; background:${fillColor};"></span></span>
            <span class="meter-pct">${fmtPct(c.pct_consumido)}</span>
          </span>
        </td>
        <td style="text-align:left;"><span class="status-badge ${st.level}"><span class="ic">${st.icon}</span>${st.label}</span></td>
      </tr>
    `;
  }).join('');

  const table = `
    <div class="panel-title">Categorias com orçamento mensal — visão acumulada do ano fiscal</div>
    <div class="panel-note">Ordem alfabética. Budget acumulado e gasto acumulado consideram Abril–${ano.mes_atual_label} (budget) e os meses com transações lançadas (gasto).</div>
    <table class="cat-table">
      <thead>
        <tr>
          <th>Categoria</th>
          <th>Budget do ano fiscal</th>
          <th>Budget acumulado (Abril–${ano.mes_atual_label})</th>
          <th>Gasto acumulado</th>
          <th>% consumido</th>
          <th style="text-align:left;">Status</th>
        </tr>
      </thead>
      <tbody>${catRows}</tbody>
    </table>
  `;

  const categoriasAnualFiltradas = ano.categorias_orcamento_anual.filter(c => c.categoria !== 'Elevah');

  const annualCatRows = categoriasAnualFiltradas.map(c => {
    const st = statusFor(c.gasto_acumulado, c.budget_anual);
    const pctBar = c.gasto_acumulado < 0 ? 100 : Math.min(100, c.pct_consumido);
    const fillColor = st.level === 'good' ? 'var(--good)' : (st.level === 'warning' ? 'var(--warning)' : 'var(--critical)');
    return `
      <tr>
        <td>${c.categoria}</td>
        <td>${fmtBRL2(c.budget_anual)}</td>
        <td>${fmtBRL2(c.gasto_acumulado)}</td>
        <td>${fmtBRL2(c.saldo)}</td>
        <td class="meter-cell">
          <span class="meter-inline">
            <span class="meter-track"><span class="meter-fill" style="width:${pctBar}%; background:${fillColor};"></span></span>
            <span class="meter-pct">${fmtPct(c.pct_consumido)}</span>
          </span>
        </td>
        <td style="text-align:left;"><span class="status-badge ${st.level}"><span class="ic">${st.icon}</span>${st.label}</span></td>
      </tr>
    `;
  }).join('');

  const totalAnualBudget = categoriasAnualFiltradas.reduce((s,c) => s + c.budget_anual, 0);
  const totalAnualGasto = categoriasAnualFiltradas.reduce((s,c) => s + c.gasto_acumulado, 0);
  const totalAnualSaldo = totalAnualBudget - totalAnualGasto;
  const totalAnualPct = totalAnualBudget > 0 ? (totalAnualGasto / totalAnualBudget * 100) : (totalAnualGasto > 0 ? 100 : 0);
  const totalAnual = { budget_anual: totalAnualBudget, gasto_acumulado: totalAnualGasto, saldo: totalAnualSaldo, pct_consumido: totalAnualPct };
  const totalAnualSt = statusFor(totalAnual.gasto_acumulado, totalAnual.budget_anual);
  const totalAnualPctBar = totalAnual.gasto_acumulado < 0 ? 100 : Math.min(100, totalAnual.pct_consumido);
  const totalAnualFillColor = totalAnualSt.level === 'good' ? 'var(--good)' : (totalAnualSt.level === 'warning' ? 'var(--warning)' : 'var(--critical)');
  const annualTotalRow = `
    <tr style="font-weight:700; background: rgba(11,11,11,0.03);">
      <td>Total (Carro + Viagem)</td>
      <td>${fmtBRL2(totalAnual.budget_anual)}</td>
      <td>${fmtBRL2(totalAnual.gasto_acumulado)}</td>
      <td>${fmtBRL2(totalAnual.saldo)}</td>
      <td class="meter-cell">
        <span class="meter-inline">
          <span class="meter-track"><span class="meter-fill" style="width:${totalAnualPctBar}%; background:${totalAnualFillColor};"></span></span>
          <span class="meter-pct">${fmtPct(totalAnual.pct_consumido)}</span>
        </span>
      </td>
      <td style="text-align:left;"><span class="status-badge ${totalAnualSt.level}"><span class="ic">${totalAnualSt.icon}</span>${totalAnualSt.label}</span></td>
    </tr>
  `;

  const annualTable = `
    <div class="panel-title">Categorias com orçamento anual — Carro e Viagem</div>
    <div class="panel-note">Essas categorias não têm orçamento mensal; o orçamento e o consumo são acompanhados no ano inteiro. Gasto acumulado considera os meses com transações lançadas (${ano.meses_com_dados.join(', ')}). Extras - Elevah passou a ser tratada como categoria mensal (veja "Categorias do orçamento mensal" em cada aba de mês).</div>
    <table class="cat-table">
      <thead>
        <tr>
          <th>Categoria</th>
          <th>Budget anual</th>
          <th>Gasto acumulado no ano</th>
          <th>Saldo</th>
          <th>% consumido</th>
          <th style="text-align:left;">Status</th>
        </tr>
      </thead>
      <tbody>${annualCatRows}${annualTotalRow}</tbody>
    </table>
  `;

  const monthShort = { 'Abril 2026':'Abril', 'Maio 2026':'Maio', 'Junho 2026':'Junho', 'Julho 2026':'Julho', 'Agosto 2026':'Agosto', 'Setembro 2026':'Setembro' };
  const monthCards = REPORT.months.map(m => {
    let level, stateLabel, budgetValue, gastoValue, gastoLabel, saldoValue, saldoLabel, pctLabel;
    if (!m.is_current) {
      level = m.saldo_real_mes >= 0 ? 'good' : 'critical';
      stateLabel = 'Fechado';
      budgetValue = m.total_budget;
      gastoValue = m.total_gasto_logado;
      gastoLabel = 'Gasto';
      saldoValue = m.saldo_real_mes;
      saldoLabel = m.saldo_real_mes >= 0 ? 'saldo real positivo' : 'saldo real negativo';
      pctLabel = `${fmtPct(m.total_budget > 0 ? (m.total_gasto_logado / m.total_budget * 100) : 0)} do budget gasto`;
    } else {
      const ratio = m.total_budget > 0 ? (m.total_projecao_fim_mes / m.total_budget) : 0;
      level = ratio >= 1 ? 'critical' : (ratio >= 0.9 ? 'warning' : 'good');
      stateLabel = 'Em andamento · projeção';
      budgetValue = m.total_budget;
      gastoValue = m.total_projecao_fim_mes;
      gastoLabel = 'Gasto (projetado)';
      saldoValue = m.saldo_vs_projecao;
      saldoLabel = 'saldo projetado vs. budget';
      pctLabel = `${fmtPct(ratio * 100)} do budget (projeção)`;
    }
    return `
      <div class="month-status-card ${level}">
        <div class="m-name">${monthShort[m.nome] || m.nome}</div>
        <div class="m-state">${stateLabel}</div>
        <div class="m-row"><span class="m-row-label">Budget</span><span class="m-row-value">${fmtBRL2(budgetValue)}</span></div>
        <div class="m-row"><span class="m-row-label">${gastoLabel}</span><span class="m-row-value">${fmtBRL2(gastoValue)}</span></div>
        <div class="m-row"><span class="m-row-label">Saldo</span><span class="m-row-value ${saldoValue >= 0 ? 'good' : 'critical'}">${saldoValue >= 0 ? '' : '-'}${fmtBRL2(Math.abs(saldoValue))}</span></div>
        <div class="m-pct">${saldoLabel}</div>
        <div class="m-pct">${pctLabel}</div>
      </div>
    `;
  }).join('');

  const monthGrid = `
    <div class="panel-title">Status por mês</div>
    <div class="panel-note">Vermelho: mês fechado com saldo negativo (ou, para o mês em andamento, projeção acima de 100% do budget). Amarelo: mês em andamento com projeção entre 90% e 100% do budget. Verde: mês fechado com saldo positivo, ou mês em andamento com projeção abaixo de 90%.</div>
    <div class="month-status-grid">${monthCards}</div>
  `;

  return `
    ${kpiRow}
    ${resumoConsolidado}
    ${monthGrid}
    ${table}
    ${annualTable}
  `;
}

function txnRowHTML(t) {
  return `
    <tr>
      <td>${brDate(t.data)}</td>
      <td style="text-align:left;">${t.categoria}</td>
      <td style="text-align:left;">${t.descricao || ''}</td>
      <td>${fmtBRL2(t.valor)}</td>
      <td><span class="txn-badge">${t.parcelado === 'Yes' ? 'Sim' : 'Não'}</span></td>
      <td><span class="txn-badge">${t.recorrente === 'Yes' ? 'Sim' : 'Não'}</span></td>
    </tr>
  `;
}

function setupTransactionFilters(m) {
  const key = m.nome.replace(/\s/g,'');
  const txns = m.transacoes || [];
  const catSelect = document.getElementById('txn-cat-'+key);
  const descInput = document.getElementById('txn-desc-'+key);
  const valorInput = document.getElementById('txn-valor-'+key);
  const clearBtn = document.getElementById('txn-clear-'+key);
  const tbody = document.getElementById('txn-tbody-'+key);
  const countEl = document.getElementById('txn-count-'+key);
  if (!catSelect || !tbody) return;

  const cats = Array.from(new Set(txns.map(t => t.categoria))).sort((a,b) => a.localeCompare(b, 'pt-BR'));
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });

  function normalize(s) {
    return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function valorMatches(valor, query) {
    if (!query) return true;
    const q = normalize(query);
    const raw = String(valor).toLowerCase();
    const fmt = normalize(fmtBRL2(valor));
    return raw.includes(q) || fmt.includes(q);
  }

  function applyFilters() {
    const catQ = catSelect.value;
    const descQ = normalize(descInput.value);
    const valorQ = valorInput.value.trim();
    const filtered = txns.filter(t => {
      if (catQ && t.categoria !== catQ) return false;
      if (descQ && !normalize(t.descricao).includes(descQ)) return false;
      if (valorQ && !valorMatches(t.valor, valorQ)) return false;
      return true;
    });
    tbody.innerHTML = filtered.length
      ? filtered.map(txnRowHTML).join('')
      : `<tr class="txn-empty-row"><td colspan="6">Nenhuma transação encontrada com esses filtros.</td></tr>`;
    countEl.textContent = `${filtered.length} de ${txns.length} transações`;
  }

  catSelect.addEventListener('change', applyFilters);
  descInput.addEventListener('input', applyFilters);
  valorInput.addEventListener('input', applyFilters);
  clearBtn.addEventListener('click', () => {
    catSelect.value = ''; descInput.value = ''; valorInput.value = '';
    applyFilters();
  });

  applyFilters();
}

function init() {
  const monthsLabel = REPORT.months.map(m => m.nome.split(' ')[0]).join(', ');
  document.getElementById('subtitle-text').textContent = `Ano fiscal ${REPORT.ano.fiscal_year_label} · meses com dados: ${monthsLabel} 2026 · atualizado até ${brDate(REPORT.today)}`;
  buildTabs();
  const mainEl = document.getElementById('main');
  REPORT.months.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'month-panel';
    div.innerHTML = monthPanelHTML(m);
    mainEl.appendChild(div);
    setupTransactionFilters(m);
  });
  const yearDiv = document.createElement('div');
  yearDiv.className = 'month-panel';
  yearDiv.innerHTML = yearPanelHTML(REPORT.ano);
  mainEl.appendChild(yearDiv);

  const lastIdx = REPORT.months.length - 1;
  document.querySelectorAll('.month-panel')[lastIdx].classList.add('active');
  document.querySelectorAll('nav.tabs button')[lastIdx].classList.add('active');
  renderMonthCharts(REPORT.months[lastIdx]);
}

init();
</script>
</body>
</html>
